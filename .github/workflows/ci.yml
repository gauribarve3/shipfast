name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/requirements.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shipfast:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name smoke shipfast:${{ github.sha }}
          sleep 5
          curl --fail localhost:5000/health
      - name: Stop container
        if: always()
        run: docker stop smoke
