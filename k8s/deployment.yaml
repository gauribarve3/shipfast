apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast
  annotations:
    kubernetes.io/change-cause: "initial deploy v1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipfast
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shipfast
    spec:
      containers:
        - name: shipfast
          image: shipfast:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
